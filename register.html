<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Vehicle Safety</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body { min-height: 100vh; display: flex; flex-direction: column; background: linear-gradient(135deg, #0b1220, #111827); color: white; overflow-x: hidden; }
    nav { position: fixed; top: 0; width: 100%; padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); z-index: 100; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
    .nav-logo { color: white; font-weight: 600; font-size: 20px; text-decoration: none; }
    .nav-links a { color: white; text-decoration: none; margin-left: 20px; font-size: 14px; transition: 0.3s; opacity: 0.8; }
    .main-wrapper { display: flex; flex: 1; flex-wrap: wrap; margin-top: 70px; }
    .left { flex: 1 1 400px; display: flex; flex-direction: column; justify-content: center; padding: 60px; background: linear-gradient(180deg, #0ea5e9, #22c55e); color: #0b1220; min-width: 300px; }
    .scene { position: relative; height: 120px; margin-top: 40px; background: #0b1220; border-radius: 12px; overflow: hidden; box-shadow: inset 0 0 25px rgba(0,0,0,0.6); }
    .road { position: absolute; bottom: 20px; width: 200%; height: 4px; background: repeating-linear-gradient(90deg, #fff 0px, #fff 35px, transparent 35px, transparent 70px); animation: roadMove 1.5s linear infinite; }
    .car { position: absolute; bottom: 30px; left: 15%; width: 70px; height: 28px; background: linear-gradient(90deg, #1f2937, #374151); border-radius: 8px 14px 6px 6px; }
    .wheel { position: absolute; bottom: -8px; width: 14px; height: 14px; background: #000; border-radius: 50%; border: 2px solid #9ca3af; animation: spin 0.6s linear infinite; }
    .wheel.front { right: 10px; } .wheel.back { left: 10px; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes roadMove { from { transform: translateX(0); } to { transform: translateX(-70px); } }
    .right { flex: 1 1 320px; display: flex; justify-content: center; align-items: center; background: #f1f5f9; min-width: 300px; padding: 30px; }
    .form-box { width: 100%; max-width: 320px; padding: 30px; background: #111827; border-radius: 14px; box-shadow: 0 0 30px rgba(0, 255, 150, 0.2); }
    h2 { text-align: center; margin-bottom: 20px; color: white; }
    input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: none; background: #1f2937; color: white; outline: none; }
    button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 8px; border: none; background: linear-gradient(45deg, #22c55e, #0ea5e9); color: black; font-weight: 600; cursor: pointer; transition: 0.3s; }
    button:hover { transform: scale(1.05); }
    .error { color: #f87171; font-size: 11px; margin: 2px 0 5px 0; min-height: 14px; }
    #statusMsg { position: fixed; bottom: 20px; right: 20px; padding: 15px 25px; border-radius: 8px; background: #22c55e; color: white; display: none; z-index: 1000; }
  </style>
</head>
<body>

<nav>
  <a href="login.html" class="nav-logo">🛡️ Safety</a>
  <div class="nav-links">
    <a href="login.html">Login</a>
  </div>
</nav>

<div class="main-wrapper">
  <div class="left">
    <h1>Vehicle Safety</h1>
    <p>Fatigue detection and automated response system.</p>
    <div class="scene">
      <div class="road"></div>
      <div class="car"><div class="wheel front"></div><div class="wheel back"></div></div>
    </div>
  </div>
  <div class="right">
    <div class="form-box">
      <h2>Create Account</h2>
      <input type="text" id="name" placeholder="Full Name">
      <p id="nameError" class="error"></p>
      <input type="text" id="phone" placeholder="Phone Number">
      <p id="phoneError" class="error"></p>
      <input type="text" id="vehicle" placeholder="Vehicle Name">
      <p id="vehicleError" class="error"></p>
      <input type="password" id="password" placeholder="Password">
      <p id="passwordError" class="error"></p>
      <button id="regBtn" onclick="register()">Register</button>
    </div>
  </div>
</div>

<div id="statusMsg"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

// Hardcoded config to ensure it works on your localhost
const firebaseConfig = {
  apiKey: "AIzaSyBeA235ALQK-yngFZOJuPFgMXBzUwVVwIo",
  authDomain: "car-safety-11c3a.firebaseapp.com",
  projectId: "car-safety-11c3a",
  storageBucket: "car-safety-11c3a.firebasestorage.app",
  messagingSenderId: "325705492469",
  appId: "1:325705492469:web:e7291ae9e3350e162022bc"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const showMsg = (text, isErr = false) => {
  const el = document.getElementById("statusMsg");
  el.innerText = text;
  el.style.background = isErr ? "#f87171" : "#22c55e";
  el.style.display = "block";
  setTimeout(() => { el.style.display = "none"; }, 3000);
};

window.register = async () => {
  const btn = document.getElementById("regBtn");
  const name = document.getElementById("name").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const vehicle = document.getElementById("vehicle").value.trim();
  const password = document.getElementById("password").value.trim();

  if (!name || !phone || !vehicle || !password) {
    showMsg("Please fill all fields", true);
    return;
  }

  btn.innerText = "Registering...";
  btn.disabled = true;

  try {
    // 1. Ensure we are authenticated to write to DB
    await signInAnonymously(auth);

    // 2. Save to 'users' collection using phone as ID (matches your screenshot)
    await setDoc(doc(db, "users", phone), {
      name, phone, vehicle, password,
      created_at: Date.now()
    });

    showMsg("Account Created! Redirecting...");
    setTimeout(() => { window.location.href = "login.html"; }, 1500);
  } catch (error) {
    console.error(error);
    showMsg("Registration failed. Enable Anonymous Auth in Firebase.", true);
    btn.innerText = "Register";
    btn.disabled = false;
  }
};
</script>
</body>
</html>
